<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Week 4 JavaScript click counter exercise.">
  <title>Week 4 Exercise 1 | Click Counter</title>
  <link rel="stylesheet" href="week4.css">
</head>
<body>
  <main>
    <a class="back-link" href="../../../index.html">Back to all weeks</a>
    <section class="panel" aria-labelledby="page-title">
      <p class="eyebrow">Week 4 · JavaScript</p>
      <h1 id="page-title">Click counter</h1>
      <p class="lede">Click the button five times to reach the goal.</p>
      <div class="counter" aria-live="polite">
        <strong id="count">0</strong>
        <span>clicks</span>
      </div>
      <button class="primary-button" id="clicker" type="button">Click me</button>
      <p class="message" id="message" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const button = document.querySelector('#clicker');
    const countDisplay = document.querySelector('#count');
    const messageDisplay = document.querySelector('#message');
    let count = 0;

    button.addEventListener('click', () => {
      count++;
      countDisplay.textContent = count;

      if (count >= 5) {
        button.classList.add('done');
        messageDisplay.textContent = 'Congratulations! You reached 5 clicks!';
      }
    });
  </script>
</body>
</html>
