<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  .card {
    /* 280px wide, 180px tall, white background, 2px teal border, 12px radius */
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #0f766e;
    border-radius: 12px;
    
    /* Position relative to establish a positioning context for the badge */
    position: relative;
    margin: 40px;
  }
  
  .badge {
    /* Position absolute in the top-right corner */
    position: absolute;
    top: 12px;
    right: 12px;
    
    /* Teal background, white text, pill shape, bold */
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 9999px; /* Creates the pill shape */
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding:16px; margin: 0;">Card content here</p>
  </div>
</body>
</html>
