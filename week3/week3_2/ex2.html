<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Refined Card Hover</title>
  <style>
    body {
      padding: 40px;
      background: #f0fdfa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      background: #ffffff;
      border: 1px solid rgba(20, 184, 166, 0.2);
      border-radius: 16px;
      padding: 24px;
      width: 260px;
      color: #0f766e;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;

      /* 1. Base CSS transition so it animates on ENTER and EXIT */
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.4s ease;

      /* Initial subtle shadow */
      box-shadow: 0 2px 8px -2px rgba(15, 118, 110, 0.08);
      cursor: pointer;
    }

    /* 2. Hover state applying translateY(-6px) and colored shadow */
    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(20, 184, 166, 0.4);
      /* Subtle, layered Apple/Google style colored shadow */
      box-shadow: 0 16px 32px -8px rgba(20, 184, 166, 0.28),
                  0 4px 12px -2px rgba(20, 184, 166, 0.12);
    }
  </style>
</head>
<body>

  <div class="card">
    Hover over me!
  </div>

</body>
</html>
