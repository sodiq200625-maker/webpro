      if (code === 0) return { label: isDay ? 'Clear sky' : 'Clear night', icon: isDay ? '☀️' : '🌙', kind: 'clear' };
      if (code === 1) return { label: 'Mostly clear', icon: isDay ? '🌤️' : '🌙', kind: 'clear' };
      if (code === 2) return { label: 'Partly cloudy', icon: '⛅', kind: 'cloud' };
      if (code === 3) return { label: 'Overcast', icon: '☁️', kind: 'cloud' };
      if (code === 45 || code === 48) return { label: 'Foggy', icon: '🌫️', kind: 'fog' };
      if (code >= 51 && code <= 57) return { label: 'Drizzle', icon: '🌦️', kind: 'rain' };
      if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return { label: 'Rain', icon: '🌧️', kind: 'rain' };
      if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { label: 'Snow', icon: '❄️', kind: 'snow' };
      if (code >= 95) return { label: 'Thunderstorm', icon: '⛈️', kind: 'storm' };
      return { label: 'Mild', icon: '🌥️', kind: 'cloud' };

    const IconBag = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>;
    const IconClose = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
    const IconStar = () => <svg className="w-4 h-4 fill-amber-400 text-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>;
    const IconTruck = () => <svg className="w-6 h-6 text-terracotta" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>;
    const IconShield = () => <svg className="w-6 h-6 text-terracotta" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
    const IconRefresh = () => <svg className="w-6 h-6 text-terracotta" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>;
    const IconLeaf = () => <svg className="w-6 h-6 text-terracotta" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>;

    const IconMoon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>;
    const IconSun = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;

    // Star rating that shows partial stars (4.7 looks like 4.7, not 5)
    function Stars({ rating }) {
      return (
        <div className="flex" aria-label={`${rating} out of 5 stars`} role="img">
          {[0, 1, 2, 3, 4].map(i => {
            const fill = Math.max(0, Math.min(1, rating - i));
            return (
              <span key={i} className="relative inline-block w-4 h-4">
                <svg className="absolute inset-0 w-4 h-4 text-taupe-muted fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                <span className="absolute inset-y-0 left-0 overflow-hidden" style={{ width: `${fill * 100}%` }}>
                  <svg className="w-4 h-4 text-amber-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                </span>
              </span>
            );
          })}
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      // Navigation state: 'home', 'shop', 'productDetail', 'about', 'contact', 'wishlist'
      const [currentView, setCurrentView] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedProductId, setSelectedProductId] = useState(null);
      const [sortOption, setSortOption] = useState('featured');

      // Drawer & Modal states
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [checkoutModalOpen, setCheckoutModalOpen] = useState(false);
      const [policyModal, setPolicyModal] = useState(null); // 'shipping', 'returns', 'privacy'

      // E-commerce state
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);
      const [newsletterEmail, setNewsletterEmail] = useState('');
      const [newsletterSuccess, setNewsletterSuccess] = useState(false);

      // --- Currency (live exchange rates) ---
      const [currency, setCurrencyState] = useState(() => {
        try { return localStorage.getItem('mebel-currency') || 'USD'; } catch (e) { return 'USD'; }
      });
      const [rates, setRates] = useState(FALLBACK_RATES);
      const [rateStatus, setRateStatus] = useState('loading'); // 'loading' | 'live' | 'offline'
      const [rateUpdated, setRateUpdated] = useState('');

      const setCurrency = (code) => {
        setCurrencyState(code);
        try { localStorage.setItem('mebel-currency', code); } catch (e) {}
      };

      useEffect(() => {
        let cancelled = false;
        fetch('https://open.er-api.com/v6/latest/USD')
          .then(r => r.json())
          .then(data => {
            if (cancelled || !data || data.result !== 'success') throw new Error('bad rates');
            const next = {};
            CURRENCIES.forEach(c => { next[c.code] = data.rates[c.code] || FALLBACK_RATES[c.code]; });
            setRates(next);
            setRateStatus('live');
            setRateUpdated(data.time_last_update_utc ? new Date(data.time_last_update_utc).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '');
          })
          .catch(() => { if (!cancelled) setRateStatus('offline'); });
        return () => { cancelled = true; };
      }, []);

      // Convert a USD price into the chosen currency and format it nicely
      const fmt = (usd) => {
        const info = CURRENCIES.find(c => c.code === currency) || CURRENCIES[0];
        let value = usd * (rates[currency] || 1);
        if (currency === 'KRW') value = Math.round(value / 1000) * 1000;
        else if (currency === 'JPY' || currency === 'RUB') value = Math.round(value / 100) * 100;
        else value = Math.round(value);
        try {
          return new Intl.NumberFormat(info.locale, { style: 'currency', currency, maximumFractionDigits: 0 }).format(value);
        } catch (e) {
          return currency + ' ' + value.toLocaleString();
        }
      };
      const money = { fmt, currency, rates, rateStatus, rateUpdated, setCurrency };

      // --- Evening (warm dark) mode ---
      const [evening, setEvening] = useState(() => {
        try { return localStorage.getItem('mebel-evening') === '1'; } catch (e) { return false; }
      });
      useEffect(() => {
        document.documentElement.classList.toggle('evening', evening);
        try { localStorage.setItem('mebel-evening', evening ? '1' : '0'); } catch (e) {}
      }, [evening]);

      // Photos that fail to load get a calm placeholder instead of a broken-image icon
      useEffect(() => {
        const onImgError = (ev) => {
          const el = ev.target;
          if (el && el.tagName === 'IMG' && el.dataset.fallback !== '1') {
            el.dataset.fallback = '1';
            el.src = IMG_FALLBACK;
          }
        };
        window.addEventListener('error', onImgError, true);
        return () => window.removeEventListener('error', onImgError, true);
      }, []);

      // Esc closes any open popup
      useEffect(() => {
        const onKey = (ev) => {
          if (ev.key === 'Escape') {
            setIsCartOpen(false); setIsSearchOpen(false); setPolicyModal(null); setCheckoutModalOpen(false);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Toast notification trigger
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Wishlist toggle
      const toggleWishlist = (id, e) => {
        if (e) e.stopPropagation();
        if (wishlist.includes(id)) {
          setWishlist(wishlist.filter(item => item !== id));
          showToast("Removed from your wishlist sanctuary");
        } else {
          setWishlist([...wishlist, id]);
          showToast("Saved to your wishlist sanctuary");
        }
      };

      // Add to Cart
      const addToCart = (product, quantity = 1, e) => {
        if (e) e.stopPropagation();
        setCart(prevCart => {
          const existingIndex = prevCart.findIndex(item => item.product.id === product.id);
          if (existingIndex > -1) {
            return prevCart.map((item, i) => i === existingIndex ? { ...item, quantity: item.quantity + quantity } : item);
          }
          return [...prevCart, { product, quantity, selectedColor: 'Standard Finish' }];
        });
        showToast(`Added ${product.name} to your cart`);
        setIsCartOpen(true);
      };

      const updateCartQuantity = (productId, delta) => {
        setCart(prevCart => 
          prevCart.map(item => {
            if (item.product.id === productId) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean)
        );
      };

      // Cart calculations
      const cartSubtotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      }, [cart]);

      const cartItemCount = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.quantity, 0);
      }, [cart]);

      // Filtered & Sorted products
      const filteredProducts = useMemo(() => {
        let list = PRODUCTS;
        if (selectedCategory !== 'all') {
          list = list.filter(p => p.category === selectedCategory);
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(p => p.name.toLowerCase().includes(q) || p.shortDesc.toLowerCase().includes(q) || p.categoryName.toLowerCase().includes(q));
        }
        if (sortOption === 'price-low') {
          list = [...list].sort((a, b) => a.price - b.price);
        } else if (sortOption === 'price-high') {
          list = [...list].sort((a, b) => b.price - a.price);
        } else if (sortOption === 'rating') {
          list = [...list].sort((a, b) => b.rating - a.rating);
        }
        return list;
      }, [selectedCategory, searchQuery, sortOption]);

      // Navigation helpers
      const openProductDetail = (productId) => {
        setSelectedProductId(productId);
        setCurrentView('productDetail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const navigateToView = (viewName, category = 'all') => {
        setCurrentView(viewName);
        if (category) setSelectedCategory(category);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const selectedProductObj = useMemo(() => {
        return PRODUCTS.find(p => p.id === selectedProductId) || PRODUCTS[0];
      }, [selectedProductId]);

      // One place that builds a product card, so every page behaves the same
      const renderCard = (product) => (
        <ProductCard
          key={product.id}
          product={product}
          isWishlisted={wishlist.includes(product.id)}
          onToggleWishlist={toggleWishlist}
          onOpenDetail={openProductDetail}
          onAddToCart={addToCart}
        />
      );

      const NAV_ITEMS = [
        { label: 'Shop', view: 'shop', category: 'all' },
        { label: 'Collections', view: 'shop', category: 'sofas' },
        { label: 'Cozy Weather', view: 'weather', isNew: true },
        { label: 'Style Quiz', view: 'quiz', isNew: true },
        { label: 'Room Planner', view: 'planner', isNew: true },
        { label: 'Our Philosophy', view: 'about' },
        { label: 'Contact', view: 'contact' },
      ];
      const isNavActive = (item) =>
        item.view === 'shop' && currentView === 'shop'
          ? (item.category === 'all' ? selectedCategory !== 'sofas' : selectedCategory === 'sofas')
          : currentView === item.view;

      return (
        <MoneyCtx.Provider value={money}>
        <div className="min-h-screen flex flex-col justify-between bg-cream text-charcoal">
          
          {/* --- ANNOUNCEMENT BANNER --- */}
          <div className="bg-sand border-b border-taupe/60 text-xs py-2 px-4 text-center tracking-wide font-medium text-charcoal-muted flex justify-center items-center gap-2">
            <span>✨ Complimentary White-Glove Home Delivery on orders over {fmt(FREE_DELIVERY_USD)}</span>
            <span className="hidden md:inline">•</span>
            <span className="hidden md:inline">30-Day Calm In-Home Trial</span>
            <span className="hidden lg:inline">•</span>
            <span className="hidden lg:inline">Demo store: checkout is a simulation</span>
          </div>

          {/* --- STICKY HEADER --- */}
          <header className="sticky top-0 z-40 bg-cream/90 backdrop-blur-md border-b border-taupe/40 transition-all">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">

              {/* Logo */}
              <button
                onClick={() => navigateToView('home')}
                className="text-left group flex items-baseline gap-1 shrink-0"
                aria-label="MEBEL Home"
              >
                <span className="font-serif text-2xl sm:text-3xl font-semibold tracking-wider text-charcoal group-hover:text-terracotta transition-colors">
                  MEBEL
                </span>
                <span className="w-1.5 h-1.5 rounded-full bg-terracotta inline-block"></span>
              </button>

              {/* Desktop Navigation Links */}
              <nav className="hidden xl:flex items-center gap-6 text-sm tracking-wide font-medium" aria-label="Main">
                {NAV_ITEMS.map(item => (
                  <button
                    key={item.label}
                    onClick={() => navigateToView(item.view, item.category || 'all')}
                    className={`transition-colors relative py-1 whitespace-nowrap ${isNavActive(item) ? 'text-terracotta font-semibold' : 'text-charcoal-muted hover:text-charcoal'}`}
                  >
                    {item.label}
                    {item.isNew && <span className="absolute -top-1.5 -right-5 text-[8px] leading-none font-bold bg-terracotta text-white rounded-full px-1 py-0.5">NEW</span>}
                  </button>
                ))}
              </nav>

              {/* Header Action Icons */}
              <div className="flex items-center gap-1 sm:gap-3">
                {/* Live currency switcher */}
                <label className="relative flex items-center" title={rateStatus === 'live' ? `Live exchange rates${rateUpdated ? ' · updated ' + rateUpdated : ''}` : rateStatus === 'loading' ? 'Loading exchange rates…' : 'Offline: showing approximate rates'}>
                  <span className="sr-only">Currency</span>
                  <span className={`absolute left-2 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full ${rateStatus === 'live' ? 'bg-olive' : rateStatus === 'loading' ? 'bg-taupe-muted animate-pulse' : 'bg-terracotta'}`}></span>
                  <select
                    value={currency}
                    onChange={(e) => { setCurrency(e.target.value); showToast(`Prices now shown in ${e.target.value}`); }}
                    className="appearance-none bg-sand border border-taupe rounded-full pl-5 pr-2 py-1.5 text-xs font-semibold text-charcoal cursor-pointer"
                  >
                    {CURRENCIES.map(c => <option key={c.code} value={c.code}>{c.flag} {c.code}</option>)}
                  </select>
                </label>

                <button
                  onClick={() => setEvening(!evening)}
                  className="p-2 text-charcoal hover:text-terracotta transition-colors"
                  aria-label={evening ? 'Switch to daylight mode' : 'Switch to cozy evening mode'}
                  title={evening ? 'Daylight mode' : 'Cozy evening mode'}
                >
                  {evening ? <IconSun /> : <IconMoon />}
                </button>

                <button
                  onClick={() => setIsSearchOpen(true)}
                  className="p-2 text-charcoal hover:text-terracotta transition-colors"
                  aria-label="Search items"
                >
                  <IconSearch />
                </button>

                <button
                  onClick={() => navigateToView('wishlist')}
                  className="p-2 text-charcoal hover:text-terracotta transition-colors relative"
                  aria-label="View Wishlist"
                >
                  <IconHeart filled={wishlist.length > 0} />
                  {wishlist.length > 0 && (
                    <span className="absolute top-1 right-1 w-4 h-4 bg-terracotta text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                      {wishlist.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setIsCartOpen(true)}
                  className="p-2 text-charcoal hover:text-terracotta transition-colors relative flex items-center gap-1.5"
                  aria-label="View Shopping Cart"
                >
                  <IconBag />
                  {cartItemCount > 0 && <span className="text-xs font-semibold hidden sm:inline">{fmt(cartSubtotal)}</span>}
                  {cartItemCount > 0 && (
                    <span className="w-5 h-5 bg-terracotta text-white text-xs font-bold rounded-full flex items-center justify-center">
                      {cartItemCount}
                    </span>
                  )}
                </button>
              </div>
            </div>

            {/* Phone & tablet navigation (the full menu only fits on large screens) */}
            <nav className="xl:hidden border-t border-taupe/40" aria-label="Main (compact)">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 flex items-center gap-2 overflow-x-auto no-scrollbar py-2">
                <button
                  onClick={() => navigateToView('home')}
                  className={`px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${currentView === 'home' ? 'bg-terracotta text-white' : 'bg-sand text-charcoal hover:bg-taupe/50'}`}
                >
                  Home
                </button>
                {NAV_ITEMS.map(item => (
                  <button
                    key={item.label}
                    onClick={() => navigateToView(item.view, item.category || 'all')}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${isNavActive(item) ? 'bg-terracotta text-white' : 'bg-sand text-charcoal hover:bg-taupe/50'}`}
                  >
                    {item.label}{item.isNew && <span className="ml-1 text-[8px] font-bold align-top opacity-80">NEW</span>}
                  </button>
                ))}
              </div>
            </nav>
          </header>

          {/* --- SEARCH OVERLAY MODAL --- */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-50 bg-charcoal/40 backdrop-blur-sm flex items-start justify-center pt-20 px-4">
              <div className="bg-cream rounded-2xl max-w-2xl w-full p-6 shadow-cozy border border-taupe relative animate-fadeIn">
                <div className="flex items-center justify-between border-b border-taupe/60 pb-3">
                  <div className="flex items-center gap-3 flex-1">
                    <IconSearch />
                    <input
                      type="text"
                      placeholder="Search furniture, lighting, or decor..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      autoFocus
                      className="w-full bg-transparent text-base focus:outline-none text-charcoal"
                    />
                  </div>
                  <button onClick={() => { setIsSearchOpen(false); setSearchQuery(''); }} aria-label="Close search" className="p-1 text-charcoal-muted hover:text-charcoal">
                    <IconClose />
                  </button>
                </div>

                {/* Realtime Quick Results */}
                <div className="mt-4 max-h-80 overflow-y-auto space-y-3">
                  {searchQuery.trim() && filteredProducts.length === 0 ? (
                    <p className="text-sm text-charcoal-muted text-center py-8">No sanctuaries found for "{searchQuery}"</p>
                  ) : (
                    filteredProducts.slice(0, 5).map(item => (
                      <div 
                        key={item.id}
                        onClick={() => {
                          openProductDetail(item.id);
                          setIsSearchOpen(false);
                          setSearchQuery('');
                        }}
                        className="flex items-center gap-4 p-2 rounded-xl hover:bg-sand/60 cursor-pointer transition-colors"
                      >
                        <img src={item.primaryImg} alt={item.name} className="w-12 h-12 object-cover rounded-lg" />
                        <div className="flex-1">
                          <h4 className="text-sm font-semibold">{item.name}</h4>
                          <span className="text-xs text-charcoal-muted">{item.categoryName} • {fmt(item.price)}</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* --- TOAST NOTIFICATION POPUP --- */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-charcoal text-cream px-5 py-3 rounded-xl shadow-lg text-xs font-medium flex items-center gap-3 animate-slideUp" role="status">
              <span>🌱 {toastMessage}</span>
            </div>
          )}

          {/* --- DYNAMIC MAIN CONTENT PAGES --- */}
          <main className="flex-grow">
            
            {/* VIEW 1: HOME PAGE */}
            {currentView === 'home' && (
              <div>
                {/* HERO SECTION */}
                <section className="relative max-w-6xl mx-auto my-6 px-4 sm:px-6 lg:px-8">
                  <div className="relative rounded-3xl overflow-hidden shadow-cozy min-h-[480px] sm:min-h-[580px] flex items-center">
                    <img 
                      src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1600&q=80" 
                      alt="Cozy Scandinavian Room" 
                      className="absolute inset-0 w-full h-full object-cover object-center"
                    />
                    <div className="absolute inset-0 bg-gradient-to-r from-cream/90 via-cream/60 to-transparent sm:w-2/3"></div>
                    
                    <div className="relative z-10 p-8 sm:p-14 max-w-xl">
                      <span className="text-xs uppercase tracking-widest font-semibold text-terracotta mb-2 block">

    // ============================================================
    //  COZY WEATHER: live weather for any city + matching furniture
    // ============================================================
    function WeatherPage({ renderCard, onNavigate }) {
      const [query, setQuery] = useState('');
      const [place, setPlace] = useState(null);   // { name, country, lat, lon }
      const [data, setData] = useState(null);
      const [status, setStatus] = useState('loading'); // 'loading' | 'ready' | 'error'
      const [errorMsg, setErrorMsg] = useState('');
      const [unit, setUnit] = useState('C');

      const CITY_CHIPS = ['Seoul', 'Moscow', 'London', 'New York', 'Tokyo', 'Paris'];

      const loadForecast = async (p) => {
        try {
          const url = 'https://api.open-meteo.com/v1/forecast'
            + `?latitude=${p.lat}&longitude=${p.lon}`
            + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day'
            + '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5';
          const res = await fetch(url);
          if (!res.ok) throw new Error('forecast failed');
          const json = await res.json();
          setPlace(p);
          setData(json);
          setStatus('ready');
        } catch (e) {
          setStatus('error');
          setErrorMsg('We could not reach the weather service. Please check your connection and try again.');
        }
      };

      const searchCity = async (name) => {
        const q = (name !== undefined ? name : query).trim();
        if (!q) return;
        setStatus('loading');
        setErrorMsg('');
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
          if (!res.ok) throw new Error('geocoding failed');
          const json = await res.json();
          if (!json.results || json.results.length === 0) {
            setStatus('error');
            setErrorMsg(`We could not find "${q}". Try the spelling in English or a larger nearby city.`);
            return;
          }
          const r = json.results[0];
          await loadForecast({ name: r.name, country: r.country || '', lat: r.latitude, lon: r.longitude });
        } catch (e) {
          setStatus('error');
          setErrorMsg('We could not reach the weather service. Please check your connection and try again.');
        }
      };

      const useMyLocation = () => {
        if (!navigator.geolocation) {
          setStatus('error');
          setErrorMsg('Your browser does not support location. Please type a city instead.');
          return;
        }
        setStatus('loading');
        navigator.geolocation.getCurrentPosition(
          (pos) => loadForecast({ name: 'Your location', country: '', lat: pos.coords.latitude, lon: pos.coords.longitude }),
          () => { setStatus('error'); setErrorMsg('Location permission was not given. Please type a city instead.'); },
          { timeout: 10000 }
        );
      };

      useEffect(() => { searchCity('London'); }, []);

      const temp = (c) => unit === 'C' ? Math.round(c) : Math.round(c * 9 / 5 + 32);

      const current = data && data.current;
      const info = current ? describeWeather(current.weather_code, current.is_day) : null;
      const advice = current ? cozyAdvice({ feelsC: current.apparent_temperature, code: current.weather_code, isDay: current.is_day }) : null;
      const picks = advice ? advice.ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean) : [];

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 animate-fadeIn">
          <nav className="text-xs text-charcoal-muted mb-4 flex items-center gap-2">
            <button onClick={() => onNavigate('home')} className="hover:underline">Home</button>
            <span>/</span>
            <span className="text-charcoal font-medium">Cozy Weather</span>
          </nav>

          <div className="max-w-2xl">
            <span className="text-xs font-semibold text-terracotta uppercase tracking-wider">Live weather</span>
            <h1 className="font-serif text-3xl sm:text-5xl font-medium mt-1 leading-tight">What does today's weather ask for?</h1>
            <p className="text-sm text-charcoal-muted mt-3 leading-relaxed">
              Type any city in the world. We read the weather there right now and suggest the furniture that suits the day.
            </p>
          </div>

          {/* Search */}
          <form
            onSubmit={(e) => { e.preventDefault(); searchCity(); }}
            className="mt-6 flex flex-col sm:flex-row gap-3 max-w-2xl"
          >
            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Search a city, e.g. Busan, Berlin, Dubai…"
              aria-label="City name"
              className="flex-1 bg-sand border border-taupe rounded-full px-5 py-3 text-sm focus:outline-none focus:border-terracotta"
            />
            <div className="flex gap-3">
              <button type="submit" className="px-6 py-3 rounded-full bg-terracotta text-white text-xs font-semibold hover:bg-terracotta-hover transition-colors shadow-md">
                Check weather
              </button>
              <button type="button" onClick={useMyLocation} className="px-4 py-3 rounded-full border border-taupe bg-sand text-xs font-semibold hover:border-terracotta transition-colors" title="Use my current location">
                📍 My location
              </button>
            </div>
          </form>

          <div className="mt-4 flex flex-wrap items-center gap-2">
            {CITY_CHIPS.map(city => (
              <button
                key={city}
                onClick={() => { setQuery(city); searchCity(city); }}
                className="px-3.5 py-1.5 rounded-full bg-sand text-xs font-medium hover:bg-taupe/50 transition-colors"
              >
                {city}
              </button>
            ))}
            <span className="flex-1"></span>
            <div className="flex rounded-full border border-taupe overflow-hidden text-xs font-semibold" role="group" aria-label="Temperature unit">
              <button onClick={() => setUnit('C')} className={`px-3 py-1.5 ${unit === 'C' ? 'bg-terracotta text-white' : 'bg-sand'}`}>°C</button>
              <button onClick={() => setUnit('F')} className={`px-3 py-1.5 ${unit === 'F' ? 'bg-terracotta text-white' : 'bg-sand'}`}>°F</button>
            </div>
          </div>

          {/* States */}
          {status === 'loading' && (
            <div className="mt-8 rounded-3xl bg-sand border border-taupe/60 p-10 text-center text-sm text-charcoal-muted animate-pulse">
              Looking up the sky…
            </div>
          )}

          {status === 'error' && (
            <div className="mt-8 rounded-3xl bg-sand border border-terracotta/40 p-8 text-center">
              <p className="text-sm text-charcoal">{errorMsg}</p>
              <button onClick={() => searchCity('London')} className="mt-3 text-xs font-semibold text-terracotta underline">Try London instead</button>
            </div>
          )}

          {status === 'ready' && current && (
            <div className="mt-8 animate-fadeIn">
              {/* Current conditions */}
              <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                <div className="lg:col-span-3 rounded-3xl bg-sand border border-taupe/60 p-6 sm:p-8 shadow-cozy">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-xs uppercase tracking-wider font-semibold text-charcoal-muted">Right now in</p>
                      <h2 className="font-serif text-2xl sm:text-3xl font-medium">{place.name}{place.country ? `, ${place.country}` : ''}</h2>
                    </div>
                    <span className="text-5xl sm:text-6xl" aria-hidden="true">{info.icon}</span>
                  </div>

                  <div className="mt-4 flex items-end gap-4">
                    <span className="font-serif text-6xl sm:text-7xl font-medium leading-none">{temp(current.temperature_2m)}°</span>
                    <div className="pb-1">
                      <p className="text-base font-medium">{info.label}</p>
                      <p className="text-xs text-charcoal-muted">Feels like {temp(current.apparent_temperature)}°{unit}</p>
                    </div>
                  </div>

                  <div className="mt-6 grid grid-cols-3 gap-3 text-center">
                    <div className="rounded-2xl bg-cream border border-taupe/40 py-3">
                      <p className="text-[11px] text-charcoal-muted">Humidity</p>
                      <p className="text-sm font-semibold">{current.relative_humidity_2m}%</p>
                    </div>
                    <div className="rounded-2xl bg-cream border border-taupe/40 py-3">
                      <p className="text-[11px] text-charcoal-muted">Wind</p>
                      <p className="text-sm font-semibold">{Math.round(current.wind_speed_10m)} km/h</p>
                    </div>
                    <div className="rounded-2xl bg-cream border border-taupe/40 py-3">
                      <p className="text-[11px] text-charcoal-muted">Today</p>
                      <p className="text-sm font-semibold">{temp(data.daily.temperature_2m_min[0])}° / {temp(data.daily.temperature_2m_max[0])}°</p>
                    </div>
                  </div>
                </div>

                {/* Cozy index */}
                <div className="lg:col-span-2 rounded-3xl bg-terracotta-soft border border-terracotta/30 p-6 sm:p-8 flex flex-col justify-between">
                  <div>
                    <p className="text-xs uppercase tracking-wider font-semibold text-terracotta">Cozy index</p>
                    <p className="font-serif text-5xl font-medium mt-1">{advice.score}<span className="text-xl text-charcoal-muted">/100</span></p>
                    <div className="h-2 rounded-full bg-cream/80 overflow-hidden mt-3">
                      <div className="h-full bg-terracotta rounded-full transition-all duration-700" style={{ width: `${advice.score}%` }}></div>
                    </div>
                  </div>
                  <div className="mt-5">
                    <h3 className="font-serif text-xl font-medium leading-snug">{advice.title}</h3>
                    <p className="text-xs text-charcoal-muted leading-relaxed mt-2">{advice.text}</p>
                  </div>
                </div>
              </div>

              {/* 5-day forecast */}
              <div className="mt-6 grid grid-cols-5 gap-2 sm:gap-3">
                {data.daily.time.map((day, i) => {
                  const d = describeWeather(data.daily.weather_code[i], 1);
                  const label = i === 0 ? 'Today' : new Date(day + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' });
                  return (
                    <div key={day} className="rounded-2xl bg-sand border border-taupe/50 py-3 px-1 text-center">
                      <p className="text-[11px] font-semibold text-charcoal-muted">{label}</p>
                      <p className="text-2xl my-1" aria-hidden="true">{d.icon}</p>
                      <p className="text-xs font-semibold">{temp(data.daily.temperature_2m_max[i])}°</p>
                      <p className="text-[11px] text-charcoal-muted">{temp(data.daily.temperature_2m_min[i])}°</p>
                    </div>
                  );
                })}
              </div>

              {/* Matching furniture */}
              <div className="mt-12">
                <h3 className="font-serif text-2xl font-medium">Picked for {place.name === 'Your location' ? 'your weather' : place.name + ' today'}</h3>
                <p className="text-xs text-charcoal-muted mt-1 mb-6">Matched to the temperature and sky right now.</p>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  {picks.map(p => renderCard(p))}
                </div>
              </div>

              <p className="text-[11px] text-charcoal-light mt-8">Weather data by Open-Meteo.com</p>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    //  STYLE QUIZ: four questions, three matched pieces
    // ============================================================
    function StyleQuiz({ renderCard, onAddToCart, onNavigate }) {
      const { fmt } = useMoney();
      const [step, setStep] = useState(0);
      const [answers, setAnswers] = useState({});

      const QUESTIONS = [
        { id: 'room', q: 'Which room are you creating?', options: [
          { v: 'living', label: 'Living room', icon: '🛋️' },
          { v: 'bedroom', label: 'Bedroom', icon: '🛏️' },
          { v: 'dining', label: 'Dining area', icon: '🍽️' },
          { v: 'any', label: 'A little of everything', icon: '🏡' },
        ] },
        { id: 'mood', q: 'How should it feel?', options: [
          { v: 'warm', label: 'Warm and enveloping', icon: '🕯️' },
          { v: 'airy', label: 'Light and airy', icon: '🌿' },
          { v: 'earthy', label: 'Earthy and natural', icon: '🍂' },
          { v: 'sculpt', label: 'Quiet and sculptural', icon: '🏺' },
        ] },
        { id: 'mat', q: 'Which materials are you drawn to?', options: [
          { v: 'fabric', label: 'Soft fabrics', icon: '🧶' },
          { v: 'wood', label: 'Natural wood', icon: '🪵' },
          { v: 'stone', label: 'Stone and ceramic', icon: '🪨' },
          { v: 'any', label: 'A mix of everything', icon: '✨' },
        ] },
        { id: 'budget', q: 'What is your budget for one piece?', options: [
          { v: 500, label: `Up to ${fmt(500)}`, icon: '🌱' },
          { v: 1500, label: `Up to ${fmt(1500)}`, icon: '🌳' },
          { v: 99999, label: 'No limit, show me the best', icon: '💎' },
        ] },
      ];

      const ROOM_NAMES = { living: 'living room', bedroom: 'bedroom', dining: 'dining area' };
      const MOOD_NAMES = { warm: 'warm', airy: 'light and airy', earthy: 'earthy', sculpt: 'quiet and sculptural' };
      const MAT_NAMES = { fabric: 'soft fabric', wood: 'natural wood', stone: 'stone and ceramic' };

      const choose = (id, v) => {
        const next = { ...answers, [id]: v };
        setAnswers(next);
        setTimeout(() => setStep(s => s + 1), 220);
      };

      const results = useMemo(() => {
        if (step < QUESTIONS.length) return [];
        const a = answers;
        const maxScore = (a.room === 'any' ? 1 : 4) + 3 + (a.mat === 'any' ? 1 : 2) + 3;
        return PRODUCTS.map(p => {
          const t = PRODUCT_TRAITS[p.id];
          let s = 0;
          const why = [];
          if (a.room === 'any') s += 1;
          else if (t.rooms.includes(a.room)) { s += 4; why.push(`suits your ${ROOM_NAMES[a.room]}`); }
          if (t.moods.includes(a.mood)) { s += 3; why.push(`has a ${MOOD_NAMES[a.mood]} feel`); }
          if (a.mat === 'any') s += 1;
          else if (t.mats.includes(a.mat)) { s += 2; why.push(`made with ${MAT_NAMES[a.mat]}`); }
          if (p.price <= a.budget) { s += 3; if (a.budget < 99999) why.push('fits your budget'); }
          else s -= 4;
          const pct = Math.max(30, Math.min(98, Math.round((s / maxScore) * 100)));
          return { product: p, score: s, pct, why };
        }).sort((x, y) => y.score - x.score || y.product.rating - x.product.rating).slice(0, 3);
      }, [step, answers]);

      const restart = () => { setStep(0); setAnswers({}); };
      const done = step >= QUESTIONS.length;
      const current = QUESTIONS[Math.min(step, QUESTIONS.length - 1)];
      const total = results.reduce((sum, r) => sum + r.product.price, 0);

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 animate-fadeIn">
          <nav className="text-xs text-charcoal-muted mb-4 flex items-center gap-2">
            <button onClick={() => onNavigate('home')} className="hover:underline">Home</button>
            <span>/</span>
            <span className="text-charcoal font-medium">Find Your Sanctuary</span>
          </nav>

          {!done && (
            <div className="max-w-2xl mx-auto text-center">
              <span className="text-xs font-semibold text-terracotta uppercase tracking-wider">Style quiz · question {step + 1} of {QUESTIONS.length}</span>
              <div className="h-1.5 rounded-full bg-taupe overflow-hidden mt-3 mb-8">
                <div className="h-full bg-terracotta transition-all duration-500" style={{ width: `${(step / QUESTIONS.length) * 100}%` }}></div>
              </div>

              <h1 key={current.id} className="font-serif text-3xl sm:text-4xl font-medium animate-fadeIn">{current.q}</h1>

              <div key={current.id + '-opts'} className={`mt-8 grid gap-3 animate-fadeIn ${current.options.length === 3 ? 'grid-cols-1 sm:grid-cols-3' : 'grid-cols-1 sm:grid-cols-2'}`}>
                {current.options.map(opt => (
                  <button
                    key={String(opt.v)}
                    onClick={() => choose(current.id, opt.v)}
                    className={`flex items-center gap-4 text-left rounded-2xl border p-5 transition-all hover:border-terracotta hover:shadow-cozy ${answers[current.id] === opt.v ? 'border-terracotta bg-terracotta-soft' : 'border-taupe bg-sand'}`}
                  >
                    <span className="text-3xl" aria-hidden="true">{opt.icon}</span>
                    <span className="text-sm font-semibold">{opt.label}</span>
                  </button>
                ))}
              </div>

              {step > 0 && (
                <button onClick={() => setStep(step - 1)} className="mt-6 text-xs font-semibold text-charcoal-muted hover:text-terracotta">&larr; Back</button>
              )}
            </div>
          )}

          {done && (
            <div className="animate-fadeIn">
              <div className="text-center max-w-xl mx-auto">
                <span className="text-xs font-semibold text-terracotta uppercase tracking-wider">Your sanctuary</span>
                <h1 className="font-serif text-3xl sm:text-5xl font-medium mt-1">Three pieces made for you</h1>
                <p className="text-sm text-charcoal-muted mt-3">Ranked by how well they match your answers.</p>
              </div>

              <div className="mt-10 grid grid-cols-1 sm:grid-cols-3 gap-6">
                {results.map((r, i) => (
                  <div key={r.product.id} className="flex flex-col gap-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold text-terracotta">#{i + 1} pick</span>
                      <span className="text-xs font-semibold bg-olive-soft text-olive rounded-full px-2.5 py-1">{r.pct}% match</span>
                    </div>
                    {renderCard(r.product)}
                    <p className="text-[11px] text-charcoal-muted leading-relaxed px-1">
                      {r.why.length ? 'Why: it ' + r.why.join(', ') + '.' : 'A flexible piece that works with most rooms.'}
                    </p>
                  </div>
                ))}
              </div>

              <div className="mt-10 rounded-3xl bg-sand border border-taupe/60 p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                  <p className="font-serif text-xl font-medium">The complete set</p>
                  <p className="text-xs text-charcoal-muted">All three together: {fmt(total)}</p>
                </div>
                <div className="flex gap-3">
                  <button onClick={restart} className="px-5 py-3 rounded-full border border-taupe text-xs font-semibold hover:border-terracotta transition-colors">Retake quiz</button>
                  <button
                    onClick={() => results.forEach(r => onAddToCart(r.product, 1))}
                    className="px-6 py-3 rounded-full bg-terracotta text-white text-xs font-semibold hover:bg-terracotta-hover transition-colors shadow-md"
                  >
                    Add all three to cart
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    //  ROOM PLANNER: does it fit? a to-scale floor plan
    // ============================================================
    function RoomPlanner({ onAddToCart, onOpenDetail, onNavigate }) {
      const { fmt } = useMoney();
      const [productId, setProductId] = useState('p1');
      const [widthM, setWidthM] = useState(4.5);
      const [lengthM, setLengthM] = useState(3.8);

      const PRESETS = [
        { label: 'Cozy bedroom', w: 3.2, l: 3.4 },
        { label: 'Living room', w: 5.0, l: 4.0 },
        { label: 'Open plan', w: 6.5, l: 5.0 },
      ];
      const plannable = PRODUCTS.filter(p => FOOTPRINTS[p.id]);
      const product = PRODUCTS.find(p => p.id === productId);
      const fp = FOOTPRINTS[productId];

      const W = Math.round(widthM * 100);
      const L = Math.round(lengthM * 100);

      // Try the piece both ways round and keep the roomier option
      const plan = useMemo(() => {
        const options = [{ w: fp.w, d: fp.d, rotated: false }, { w: fp.d, d: fp.w, rotated: true }].map(o => {
          const fits = o.w <= W && o.d <= L;
          let margin;
          if (fp.place === 'wall') margin = L - o.d;
          else if (fp.place === 'center') margin = Math.min((W - o.w) / 2, (L - o.d) / 2);
          else margin = Math.min((W - o.w) / 2, L - o.d);
          return { ...o, fits, margin };
        });
        const fitting = options.filter(o => o.fits).sort((a, b) => b.margin - a.margin);
        const best = fitting[0] || options[0];
        let status;
        if (!best.fits) status = 'no';
        else if (best.margin >= fp.need) status = 'good';
        else if (best.margin >= fp.need * 0.6) status = 'tight';
        else status = 'cramped';
        const x = (W - best.w) / 2;
        const y = fp.place === 'center' ? (L - best.d) / 2 : 0;
        return { ...best, status, x, y };
      }, [productId, W, L]);

      const STATUS = {
        good:    { label: 'Fits comfortably', color: '#707A5E', icon: '✅' },
        tight:   { label: 'Fits, but it will be snug', color: '#C9962B', icon: '🟡' },
        cramped: { label: 'Fits, but very cramped', color: '#C86D51', icon: '🟠' },
        no:      { label: 'Too big for this room', color: '#B5483A', icon: '⛔' },
      };
      const st = STATUS[plan.status];

      const floorUsed = Math.round(((plan.w * plan.d) / (W * L)) * 100);
      const margin = Math.max(0, Math.round(plan.margin));

      let message;
      if (plan.status === 'no') {
        message = `${product.name} needs ${fp.w} × ${fp.d} cm of floor. Your room is ${W} × ${L} cm, so it will not fit. Try a larger room or a smaller piece.`;
      } else {
        message = `You will have about ${margin} cm of free space ${fp.hint}${plan.status === 'good' ? ', which is plenty.' : `. We recommend at least ${fp.need} cm.`}${plan.rotated ? ' We turned it 90° so it fits better.' : ''}`;
      }

      // Drawing (units are centimetres)
      const pad = 60;
      const cw = Math.max(W, plan.w);
      const ch = Math.max(L, plan.d);
      const fs = Math.max(cw, ch) / 28;
      const need = fp.need;
      let zone;
      if (fp.place === 'wall') zone = { x: plan.x, y: plan.d, w: plan.w, h: need };
      else if (fp.place === 'center') zone = { x: plan.x - need, y: plan.y - need, w: plan.w + need * 2, h: plan.d + need * 2 };
      else zone = { x: plan.x - need, y: 0, w: plan.w + need * 2, h: plan.d + need };

      const gridX = []; for (let gx = 100; gx < W; gx += 100) gridX.push(gx);
      const gridY = []; for (let gy = 100; gy < L; gy += 100) gridY.push(gy);

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 animate-fadeIn">
          <nav className="text-xs text-charcoal-muted mb-4 flex items-center gap-2">
            <button onClick={() => onNavigate('home')} className="hover:underline">Home</button>
            <span>/</span>
            <span className="text-charcoal font-medium">Room Planner</span>
          </nav>

          <div className="max-w-2xl">
            <span className="text-xs font-semibold text-terracotta uppercase tracking-wider">Will it fit?</span>
            <h1 className="font-serif text-3xl sm:text-5xl font-medium mt-1 leading-tight">See it in your room before you buy</h1>
            <p className="text-sm text-charcoal-muted mt-3 leading-relaxed">
              Choose a piece, set the size of your room, and we draw it to scale, including the space you need to walk around it.
            </p>
          </div>

          <div className="mt-8 grid grid-cols-1 lg:grid-cols-5 gap-8">
            {/* Controls */}
            <div className="lg:col-span-2 space-y-6">
              <div>
                <h2 className="text-xs font-semibold uppercase tracking-wider text-charcoal-muted mb-3">1 · Choose a piece</h2>
                <div className="grid grid-cols-1 gap-2">
                  {plannable.map(p => (
                    <button
                      key={p.id}
                      onClick={() => setProductId(p.id)}
                      className={`flex items-center gap-3 text-left rounded-2xl border p-2.5 transition-all ${productId === p.id ? 'border-terracotta bg-terracotta-soft' : 'border-taupe bg-sand hover:border-terracotta/50'}`}
                    >
                      <img src={p.primaryImg} alt="" className="w-12 h-12 rounded-xl object-cover" />
                      <span className="flex-1">
                        <span className="block text-xs font-semibold leading-snug">{p.name}</span>
                        <span className="block text-[11px] text-charcoal-muted">{FOOTPRINTS[p.id].w} × {FOOTPRINTS[p.id].d} cm</span>
                      </span>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <h2 className="text-xs font-semibold uppercase tracking-wider text-charcoal-muted mb-3">2 · Your room size</h2>
                <div className="flex flex-wrap gap-2 mb-4">
                  {PRESETS.map(pr => (
                    <button
                      key={pr.label}
                      onClick={() => { setWidthM(pr.w); setLengthM(pr.l); }}
                      className="px-3.5 py-1.5 rounded-full bg-sand text-xs font-medium hover:bg-taupe/50 transition-colors"
                    >
                      {pr.label}
                    </button>
                  ))}
                </div>
                <label className="block text-xs font-medium mb-1">Width: <strong>{widthM.toFixed(1)} m</strong></label>
                <input type="range" min="2" max="8" step="0.1" value={widthM} onChange={(e) => setWidthM(parseFloat(e.target.value))} className="w-full mb-4" />
                <label className="block text-xs font-medium mb-1">Length: <strong>{lengthM.toFixed(1)} m</strong></label>
                <input type="range" min="2" max="8" step="0.1" value={lengthM} onChange={(e) => setLengthM(parseFloat(e.target.value))} className="w-full" />
              </div>
            </div>

            {/* Floor plan */}
            <div className="lg:col-span-3">
              <div className="rounded-3xl bg-sand border border-taupe/60 p-4 sm:p-6 shadow-cozy">
                <svg viewBox={`${-pad} ${-pad} ${cw + pad * 2} ${ch + pad * 2}`} className="w-full h-auto" role="img" aria-label={`Floor plan of a ${widthM.toFixed(1)} by ${lengthM.toFixed(1)} metre room with ${product.name}`} style={{ maxHeight: '460px' }}>
                  {/* room */}
                  <rect x="0" y="0" width={W} height={L} style={{ fill: 'rgb(var(--c-cream))', stroke: 'rgb(var(--c-charcoal))' }} strokeWidth="3" vectorEffect="non-scaling-stroke" />
                  {gridX.map(gx => <line key={'gx' + gx} x1={gx} y1="0" x2={gx} y2={L} style={{ stroke: 'rgb(var(--c-taupe))' }} strokeWidth="1" vectorEffect="non-scaling-stroke" />)}
                  {gridY.map(gy => <line key={'gy' + gy} x1="0" y1={gy} x2={W} y2={gy} style={{ stroke: 'rgb(var(--c-taupe))' }} strokeWidth="1" vectorEffect="non-scaling-stroke" />)}

                  {/* walking space */}
                  {plan.status !== 'no' && (
                    <rect
                      x={Math.max(0, zone.x)} y={Math.max(0, zone.y)}
                      width={Math.min(W, zone.x + zone.w) - Math.max(0, zone.x)}
                      height={Math.min(L, zone.y + zone.h) - Math.max(0, zone.y)}
                      fill={st.color} fillOpacity="0.1" stroke={st.color} strokeDasharray="6 5" strokeWidth="1.5" vectorEffect="non-scaling-stroke" rx="6"
                    />
                  )}

                  {/* the piece */}
                  <rect x={plan.x} y={plan.y} width={plan.w} height={plan.d} rx="8" fill={st.color} fillOpacity="0.85" stroke={st.color} strokeWidth="2" vectorEffect="non-scaling-stroke" />
                  <text x={plan.x + plan.w / 2} y={plan.y + plan.d / 2} textAnchor="middle" dominantBaseline="middle" fontSize={fs} fontWeight="600" fill="#fff">
                    {plan.w} × {plan.d} cm
                  </text>

                  {/* dimension labels */}
                  <text x={cw / 2} y={-pad / 2.4} textAnchor="middle" fontSize={fs} style={{ fill: 'rgb(var(--c-charcoal-muted))' }}>{widthM.toFixed(1)} m</text>
                  <text x={-pad / 2.2} y={ch / 2} textAnchor="middle" fontSize={fs} transform={`rotate(-90 ${-pad / 2.2} ${ch / 2})`} style={{ fill: 'rgb(var(--c-charcoal-muted))' }}>{lengthM.toFixed(1)} m</text>
                </svg>
                <p className="text-[11px] text-charcoal-muted text-center mt-2">Each grid square is 1 m × 1 m. Dashed area = space to walk.</p>
              </div>

              {/* Verdict */}
              <div className="mt-5 rounded-3xl border p-5 sm:p-6" style={{ borderColor: st.color + '66', background: st.color + '14' }}>
                <p className="font-serif text-xl font-medium flex items-center gap-2"><span aria-hidden="true">{st.icon}</span> {st.label}</p>
                <p className="text-xs sm:text-sm text-charcoal-muted leading-relaxed mt-2">{message}</p>
                <p className="text-xs text-charcoal-muted mt-1">The piece takes up about {floorUsed}% of your floor.</p>
                <div className="mt-4 flex flex-wrap gap-3">
                  <button
                    onClick={() => onAddToCart(product, 1)}
                    className="px-6 py-3 rounded-full bg-terracotta text-white text-xs font-semibold hover:bg-terracotta-hover transition-colors shadow-md"
                  >
                    Add to cart · {fmt(product.price)}
                  </button>
                  <button
                    onClick={() => onOpenDetail(productId)}
                    className="px-5 py-3 rounded-full border border-taupe text-xs font-semibold hover:border-terracotta transition-colors"
                  >
                    View details
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
